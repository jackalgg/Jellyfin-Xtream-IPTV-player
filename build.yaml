overview: "Xtream Codes and M3U IPTV for Jellyfin that actually plays movies and series."
description: >
  StreamFin connects an Xtream Codes panel or an M3U playlist and turns it into
  ordinary Jellyfin Live TV plus real movie and series libraries. Films and shows
  play through StreamFin the way a regular IPTV player would: the right User-Agent,
  Referer, redirect following, and a walk of container extensions when the panel
  advertised the wrong one.
